# Конфигурация dev-viewer
# Использование: docker compose up dev-viewer -d --build

# ============================================================================
# Launcher'ы
# ============================================================================
launchers:
  - url: http://localhost:8111
    name: "Основная нода"
  - url: http://localhost:8222
    name: "Резервная нода"

# ============================================================================
# Серверы UniSet2
# ============================================================================
servers:
  - url: http://localhost:9090
  - url: http://localhost:9191
  - url: http://localhost:9292
  - url: http://localhost:9393
  - url: http://localhost:9494
  - url: http://localhost:9595
  - url: http://localhost:9696
  - url: http://localhost:8081

# ============================================================================
# Журналы
# ============================================================================
journals:
  - url: "clickhouse://localhost:9000/uniset"
    name: "DevJournal"

# ============================================================================
# Sidebar groups
# ============================================================================
sidebar:
  groups:
    - name: "Управление"
      icon: "⚙️"
      patterns:
        - "launcher:*"
        - "dashboard:*"
    - name: "Мониторинг"
      icon: "📊"
      patterns:
        - "object:*"
        - "journal:*"
