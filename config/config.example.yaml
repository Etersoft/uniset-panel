# Пример конфигурации uniset-panel
# Использование: ./uniset-panel --config config/config.yaml

# ============================================================================
# Launcher'ы (управление процессами)
# ============================================================================
# launchers:
#   - url: http://localhost:8111
#     name: "Основная нода"
#     controlToken: "secret"           # токен для управления (restart/stop/start)
#
#   - url: http://192.168.1.100:8111
#     name: "Резервная нода"
#     # без controlToken — только просмотр (read-only)

# ============================================================================
# Серверы UniSet2
# ============================================================================
servers:
  - url: http://localhost:8080
    name: "Основной сервер"

  - url: http://192.168.1.100:8080
    id: backup
    name: "Резервный сервер"

  - url: http://192.168.1.101:8080
    # name и id опциональны - будет сгенерирован ID из URL

# ============================================================================
# Журналы сообщений (ClickHouse)
# ============================================================================
journals:
  # Простой вариант - только URL
  - url: "clickhouse://localhost:9000/uniset"
    name: "Production"

  # Полный вариант со всеми настройками
  - url: "clickhouse://192.168.1.50:9000/logs"
    name: "Test Environment"
    table: "main_messages_src"    # таблица с сообщениями (по умолчанию main_messages_src)
    database: "logs"              # база данных (опционально, берётся из URL)

# Альтернативный вариант - простой список URL (name генерируется из URL)
# journalUrls:
#   - "clickhouse://host1:9000/uniset"
#   - "clickhouse://host2:9000/uniset"

# ============================================================================
# Настройки UI
# ============================================================================
# controlsEnabled: true           # Включить режим управления (set/freeze)
# ioncUISensorsFilter: false      # Фильтрация IONC на клиенте (default: серверная)
# opcuaUISensorsFilter: false     # Фильтрация OPCUA на клиенте (default: серверная)

# ============================================================================
# Sidebar (группировка элементов в боковой панели)
# ============================================================================
# Если sidebar не указан — все сущности отображаются в одном плоском списке.
# Каждая группа собирает сущности по паттернам и/или точным именам.
# Сущность попадает только в первую подходящую группу (first-match-wins).
# Несовпавшие сущности автоматически попадают в группу "Прочие".
#
# sidebar:
#   groups:
#     - name: "Управление"
#       patterns:
#         - "launcher:*"             # все launcher'ы
#         - "dashboard:*"            # все dashboard'ы
#
#     - name: "Дизель"
#       icon: "engine"               # иконка (зарезервировано)
#       items:
#         - "DieselLog"              # точное совпадение по имени (любой тип)
#       patterns:
#         - "object:Diesel*@diesel"  # объекты Diesel* с сервера diesel
#
#     - name: "Мониторинг"
#       patterns:
#         - "object:*"               # все оставшиеся объекты
#         - "journal:*"              # все журналы
#
#     - name: "Инфраструктура"
#       patterns:
#         - "server:*"               # все серверы

# ============================================================================
# Настройки опроса
# ============================================================================
# pollInterval: "1s"              # Интервал опроса серверов UniSet2
# historyTTL: "1h"                # Время хранения истории значений для графиков
