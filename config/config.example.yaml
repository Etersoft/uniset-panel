#         - "dashboard:*"            # все dashboard'ы
#
#     # Паттерн name@id: после @ указывается server id (НЕ name!)
#     # Если id не задан явно, используется автохеш — лучше задавать id в servers
#     - name: "Основной"
#       icon: "🏭"                   # emoji: 🔧 ⚡ 🏭 🌡️ 💧 📊 🖥️ и т.д.
#       patterns:
#         - "object:*@main"          # все объекты с сервера id=main
#         - "journal:*"              # все журналы
#
#     - name: "Резерв"
