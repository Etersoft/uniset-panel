# Multi-server test configuration
# Usage: docker-compose -f docker-compose.multi.yml up --build --abort-on-container-exit

services:
  # First mock UniSet2 server (objects: TestProc, SharedMemory)
  mock-uniset-1:
    build:
      context: ./tests/mock-server
      dockerfile: Dockerfile
    environment:
      - PORT=9393
      - SERVER_NAME=Server1
    expose:
      - "9393"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9393/api/v2/list"]
      interval: 2s
      timeout: 5s
      retries: 5

  # Second mock UniSet2 server (different objects)
  mock-uniset-2:
    build:
      context: ./tests/mock-server-2
      dockerfile: Dockerfile
    environment:
      - PORT=9394
      - SERVER_NAME=Server2
    expose:
      - "9394"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9394/api/v2/list"]
      interval: 2s
      timeout: 5s
      retries: 5

  # Viewer with two UniSet servers
  viewer-multi:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      ./uniset-panel
      --addr :8000
      --uniset-url http://mock-uniset-1:9393
      --uniset-url http://mock-uniset-2:9394
      --uniset-config /app/config/test.xml
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    depends_on:
      mock-uniset-1:
        condition: service_healthy
      mock-uniset-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/version"]
      interval: 2s
      timeout: 5s
      retries: 5

  # Playwright tests for multi-server
  e2e-multi:
    image: mcr.microsoft.com/playwright:v1.40.0-jammy
    working_dir: /app
    shm_size: 1g
    environment:
      - BASE_URL=http://viewer-multi:8000
      - MULTI_SERVER=true
    volumes:
      - ./tests:/app:ro
      - ./tests/test-results:/app/test-results
      - ./tests/playwright-report:/app/playwright-report
    depends_on:
      viewer-multi:
        condition: service_healthy
    # Entrypoint passes positional args to playwright if provided.
    # Default (no args, e.g. `docker compose -f docker-compose.multi.yml up e2e-multi`): runs multi/.
    # Override (e.g. `docker compose run --rm e2e-multi multi/foo.spec.ts`): runs only specified specs.
    entrypoint:
      - bash
      - -lc
      - |
        set -e
        cd /tmp
        cp -r /app/* .
        rm -rf node_modules test-results playwright-report unit/node_modules mock-server/node_modules mock-server-2/node_modules
        # npm ci из lockfile — детерминированный install, быстрее `npm install`.
        # Сохраняем cp -r /app/*  (tar pipe ломает chromium navigation,
        # причина неясна; экономия ~3-5 sec не стоит риска).
        npm ci --no-fund --no-audit
        if [ "$#" -gt 0 ]; then
          npx playwright test "$@" --reporter=list
        else
          npx playwright test multi/ --reporter=list
        fi
      - bash
